<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Símbolo Hub de Solutec">
  <defs>
    <linearGradient id="hubStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102744"/>
      <stop offset="1" stop-color="#1769AA"/>
    </linearGradient>
  </defs>

  <!-- Hexágono exterior -->
  <polygon points="32,3 58,17.5 58,46.5 32,61 6,46.5 6,17.5"
           fill="none" stroke="url(#hubStroke)" stroke-width="4"
           stroke-linejoin="round"/>

  <!-- Brazos del hub -->
  <g stroke="#A9B8C8" stroke-width="2.2" stroke-linecap="round">
    <line x1="32" y1="32" x2="32" y2="17.5"/>
    <line x1="32" y1="32" x2="45.5" y2="24.75"/>
    <line x1="32" y1="32" x2="45.5" y2="39.25"/>
    <line x1="32" y1="32" x2="32" y2="46.5"/>
    <line x1="32" y1="32" x2="18.5" y2="39.25"/>
    <line x1="32" y1="32" x2="18.5" y2="24.75"/>
  </g>

  <!-- Nodos periféricos -->
  <g fill="#102744">
    <circle cx="32" cy="17.5" r="3.1"/>
    <circle cx="45.5" cy="24.75" r="3.1"/>
    <circle cx="45.5" cy="39.25" r="3.1"/>
    <circle cx="32" cy="46.5" r="3.1"/>
    <circle cx="18.5" cy="39.25" r="3.1"/>
    <circle cx="18.5" cy="24.75" r="3.1"/>
  </g>

  <!-- Nodo central -->
  <circle cx="32" cy="32" r="8.5" fill="#1769AA"/>
  <circle cx="32" cy="32" r="3.4" fill="#F4F7FA"/>
</svg>
